services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: dompu-whatsapp-app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - "8000:8000"
    depends_on:
      - redis

  redis:
    image: redis:7
    container_name: dompu-whatsapp-redis
    ports:
      - "6379:6379"

  ngrok:
    image: ngrok/ngrok:latest
    container_name: dompu-whatsapp-ngrok
    command: http app:8000
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - app
